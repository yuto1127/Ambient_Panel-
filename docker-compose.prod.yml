services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8000:80"
    environment:
      - ENVIRONMENT=production
    volumes:
      - /dev:/dev  # Raspberry Piのデバイスファイルにアクセス
      - app_data:/app/data
    restart: unless-stopped
    privileged: true  # I2Cデバイスアクセスのため

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data: