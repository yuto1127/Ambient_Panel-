services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:80"
    volumes:
      - .:/app
      - /dev:/dev  # Raspberry Piのデバイスファイルにアクセス
    environment:
      - ENVIRONMENT=development
    restart: unless-stopped
    privileged: true  # I2Cデバイスアクセスのため

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped